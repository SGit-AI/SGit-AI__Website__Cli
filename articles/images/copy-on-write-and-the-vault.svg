<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="ui-sans-serif, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5f66"/></marker></defs>
<rect width="900" height="340" fill="#faf9f5"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1c1d21" text-anchor="start">Share until you write: commits share unchanged trees; a lane would take the stream</text>
<rect x="24" y="60" width="150" height="54" rx="9" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="36" y="82" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">commit 1</text>
<text x="36" y="102" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">tree t1</text>
<rect x="24" y="170" width="150" height="54" rx="9" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="36" y="192" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">commit 2</text>
<text x="36" y="212" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">tree t2 (new)</text>
<rect x="230" y="60" width="170" height="54" rx="9" fill="#ffffff" stroke="#d5d0c2" stroke-width="1.5"/>
<text x="242" y="82" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">docs/  (shared)</text>
<text x="242" y="102" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">same id in both</text>
<rect x="230" y="130" width="170" height="54" rx="9" fill="#ffffff" stroke="#d5d0c2" stroke-width="1.5"/>
<text x="242" y="152" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">mail/  (shared)</text>
<text x="242" y="172" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">same id in both</text>
<rect x="230" y="200" width="170" height="54" rx="9" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="242" y="222" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">runs/  (changed)</text>
<text x="242" y="242" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">new tree, new blobs</text>
<line x1="174" y1="87" x2="228" y2="87" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="174" y1="87" x2="228" y2="152" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="174" y1="197" x2="228" y2="160" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="174" y1="197" x2="228" y2="92" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="174" y1="197" x2="228" y2="226" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<text x="24" y="290" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">Shipped: a branch is a pointer; a commit stores only what changed.</text>
<rect x="480" y="60" width="180" height="70" rx="9" fill="#ffffff" stroke="#d5d0c2" stroke-width="1.5"/>
<text x="492" y="82" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">many small writes</text>
<text x="492" y="102" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">an agent, a log, a stream</text>
<rect x="480" y="160" width="180" height="70" rx="9" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="492" y="182" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">append lane</text>
<text x="492" y="202" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">exists: ~200 entries/s</text>
<text x="492" y="219" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">in memory</text>
<rect x="700" y="160" width="176" height="70" rx="9" fill="#fbefe3" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="712" y="182" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">fold</text>
<text x="712" y="202" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">proposed: a batch</text>
<text x="712" y="219" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">becomes one commit</text>
<rect x="700" y="60" width="176" height="70" rx="9" fill="#fbefe3" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="712" y="82" font-size="14" font-weight="700" fill="#1c1d21" text-anchor="start">signed commit</text>
<text x="712" y="102" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">proposed</text>
<line x1="570" y1="130" x2="570" y2="158" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="660" y1="195" x2="698" y2="195" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="788" y1="160" x2="788" y2="132" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<text x="480" y="290" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">Proposed: a write-ahead lane, folded later, like an LSM store.</text>
</svg>
