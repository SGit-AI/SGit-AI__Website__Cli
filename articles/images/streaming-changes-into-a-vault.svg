<line x1="650" y1="140" x2="698" y2="112" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="650" y1="170" x2="698" y2="206" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
<text x="24" y="300" font-size="12" font-weight="400" fill="#5c5f66" text-anchor="start">Patches are an ingest format: the store keeps whole, immutable objects; a patch is applied at fold time.</text>
</svg>
